version: 2

before:
  hooks:
    - go mod verify

builds:
  - id: gz-quality
    main: ./cmd/quality
    binary: gz-quality
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'README'
  groups:
    - title: 'New Features'
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: 'Performance Improvements'
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: 'Refactorings'
      regexp: '^.*?refactor(\(.+\))??!?:.+$'
      order: 3
    - title: 'Other Changes'
      order: 999

release:
  github:
    owner: Gizzahub
    name: gzh-cli-quality
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## gzh-cli-quality {{.Version}}

    Multi-language code quality tool orchestrator for Go, Python, JavaScript/TypeScript, and Rust projects.

    ### Installation

    **Using Go Install:**
    ```bash
    go install github.com/Gizzahub/gzh-cli-quality/cmd/quality@{{.Tag}}
    ```

    **Using Pre-built Binaries:**
    Download the appropriate binary for your platform below.

  footer: |
    ### Known limitations

    The PRODUCT target of a 60x cache speedup has not been demonstrated. Cache benefit varied across repeated measurements of the same formatter workload; no general speedup is claimed.

    **Full Changelog**: https://github.com/Gizzahub/gzh-cli-quality/compare/{{.PreviousTag}}...{{.Tag}}

    ---
    For issues and feature requests, please visit: https://github.com/Gizzahub/gzh-cli-quality/issues

# Match the existing gz-git distribution in Gizzahub/homebrew-tap.
homebrew_casks:
  - name: gz-quality
    ids: [default]
    binaries: [gz-quality]
    directory: Casks
    repository:
      owner: Gizzahub
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/Gizzahub/gzh-cli-quality"
    description: "Multi-language formatter and linter orchestrator"
    license: MIT
    # Use Homebrew's declarative flight API; preserve its staged_path token
    # through GoReleaser's template pass. Limit removal to the installed binary.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/gz-quality"]
        end
      end
