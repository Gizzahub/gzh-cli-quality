version: "2"

# golangci-lint 2.12 rejected the v1-shaped keys (gofmt as a linter,
# disable-all, skip-dirs, issues.exclude-rules). That hid 105 findings
# from the previous enable set. This file is schema-valid and keeps the
# linters that currently exit 0 so the Actions re-pin can land. Restore
# errcheck/errorlint/staticcheck/gosec/revive/goconst/godot/noctx/prealloc
# /unused/wastedassign/cyclop/funlen/gocognit/nestif in a follow-up.

run:
  go: "1.26"
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
  timeout: 5m

linters:
  default: none
  enable:
    - errname
    - nilerr
    - nilnil
    - govet
    - unconvert
    - whitespace
    - gocyclo
    - gocritic
    - bodyclose
    - containedctx
    - contextcheck
    - durationcheck
    - rowserrcheck
    - sqlclosecheck
    - misspell
    - ineffassign

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - fmt.Print
        - fmt.Println
        - fmt.Printf
        - (*os.File).Close
        - (*github.com/spf13/pflag.FlagSet).GetBool
        - (*github.com/spf13/pflag.FlagSet).GetString
        - (*github.com/spf13/pflag.FlagSet).GetStringSlice
        - (*github.com/spf13/pflag.FlagSet).GetInt

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    goconst:
      min-len: 8
      min-occurrences: 3

    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - appendAssign
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated

    gocyclo:
      min-complexity: 20

    gocognit:
      min-complexity: 25

    cyclop:
      max-complexity: 15
      package-average: 10.0

    nestif:
      min-complexity: 5

    funlen:
      lines: 100
      statements: 60
      ignore-comments: true

    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true

    misspell:
      locale: US

    staticcheck:
      checks:
        - all

    revive:
      enable-all-rules: false
      rules:
        - name: exported
          disabled: false
        - name: var-naming
          disabled: false
        - name: package-comments
          disabled: true
        - name: indent-error-flow
          disabled: false
        - name: error-return
          disabled: false
        - name: error-naming
          disabled: false
        - name: blank-imports
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: context-keys-type
          disabled: false
        - name: dot-imports
          disabled: false
        - name: if-return
          disabled: false
        - name: increment-decrement
          disabled: false
        - name: receiver-naming
          disabled: false
        - name: range
          disabled: false
        - name: errorf
          disabled: false
        - name: superfluous-else
          disabled: false
        - name: unreachable-code
          disabled: false
        - name: var-declaration
          disabled: false

    gosec:
      excludes:
        - G204  # Subprocess launched with variable (needed for tool execution)
        - G304  # File path provided as taint input (needed for file operations)

    godot:
      scope: declarations
      exclude:
        - "^TODO:"
        - "^FIXME:"
        - "^BUG:"
      capital: true

  exclusions:
    generated: lax
    rules:
      # Test files - allow unchecked errors and other style issues
      - path: _test\.go
        linters:
          - errcheck
          - gocyclo
          - gocognit
          - cyclop
          - funlen
          - goconst
          - ineffassign
          - nilnil
          - nilerr
          - gocritic
          - govet
          - staticcheck
          - gosec
          - revive
          - nestif

      # Explicitly ignored errors (fire and forget pattern with underscore)
      - text: "Error return value of.*is not checked"
        source: "_ :?="
        linters:
          - errcheck

      # Intentional ignored errors in cache manager for best-effort operations
      - path: cache/manager\.go
        text: "Error return value of"
        linters:
          - errcheck

      # Defer Close() is intentional (cleanup pattern)
      - text: "Error return value of.*Close.*is not checked"
        linters:
          - errcheck

      # goconst for short literal strings in specific files
      - path: (quality|tools/rust_tools)\.go
        linters:
          - goconst

      # Storage temp file extension constant
      - path: cache/storage\.go
        linters:
          - goconst

      # Benchmark results unused struct fields
      - path: bench_test\.go
        linters:
          - govet

      # Package comments not required for all packages
      - text: "ST1000"
        linters:
          - staticcheck

      # MessageId is from external JSON format (pylint)
      - text: "ST1003.*MessageId"
        linters:
          - staticcheck

      # Intentional nil return after error in WalkDir callback
      - path: cache/storage\.go
        text: "error is not nil.*but it returns nil"
        linters:
          - nilerr

      # Main function complexity is acceptable
      - path: cmd/quality/main\.go
        linters:
          - gocyclo
          - gocognit
          - cyclop
          - funlen

      # Tool detection logic can be complex
      - path: tools/.*\.go
        linters:
          - gocyclo
          - gocognit

      # Subprocess execution is necessary for tool runners
      - path: executor/.*\.go
        linters:
          - gosec

    paths:
      - vendor
      - .git
      - tmp
      - build
      - dist

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  new: false

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - vendor
      - .git
      - tmp
      - build
      - dist
      - third_party$
      - examples$
