name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  goreleaser:
    name: Build release artifacts without publishing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true

      - name: Set up uv for Markdown quality checks
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.17'

      - name: Verify release quality
        run: make release-quality

      - name: Resolve pinned GoReleaser version
        id: goreleaser
        run: echo "version=$(make -s print-goreleaser-version)" >> "$GITHUB_OUTPUT"

      - name: Verify frozen checkout stayed clean
        run: |
          test -z "$(git status --porcelain)" || {
            echo "::error::Release verification modified the checkout"
            git status --short
            exit 1
          }

      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser.outputs.version }}
          args: check

      - name: Build unpublished release candidate
        if: github.event_name == 'workflow_dispatch'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser.outputs.version }}
          args: release --snapshot --clean

      - name: Build tagged release artifacts without publishing
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser.outputs.version }}
          args: release --skip=publish --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'push' && 'release-tag-build' || 'release-candidate' }}
          path: dist/
          if-no-files-found: error
