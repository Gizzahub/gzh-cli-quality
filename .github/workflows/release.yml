name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: Release with GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true

      - name: Set up uv for Markdown quality checks
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.17'

      - name: Verify release quality
        run: make release-quality

      - name: Resolve pinned GoReleaser version
        id: goreleaser
        run: echo "version=$(make -s print-goreleaser-version)" >> "$GITHUB_OUTPUT"

      - name: Test tap write proof protocol offline
        run: bin/tools/python/mdformat/bin/python -I -B scripts/test_verify_tap_write.py

      - name: Verify tap publishing credential write and cleanup
        timeout-minutes: 3
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bin/tools/python/mdformat/bin/python -I -B scripts/verify_tap_write.py

      - name: Verify frozen checkout stayed clean
        run: |
          test -z "$(git status --porcelain)" || {
            echo "::error::Release verification modified the checkout"
            git status --short
            exit 1
          }

      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser.outputs.version }}
          args: check

      - name: Build unpublished release candidate
        if: github.event_name == 'workflow_dispatch'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser.outputs.version }}
          args: release --snapshot --clean

      - name: Upload unpublished release candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error

      - name: Run GoReleaser
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser.outputs.version }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
