name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout 5m

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, the first OS leg to fail cancels the other two. Across the
      # last six runs exactly one leg ever reported and windows-latest has never
      # once run to completion, so its result is unknown. Losing two thirds of
      # the signal on every red run is a worse trade than the runner minutes.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.6']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile coverage.out ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true

      - name: Build binary
        run: make build

      - name: Test binary
        run: |
          ./build/gz-quality version
          ./build/gz-quality list
          ./build/gz-quality --help

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gz-quality-linux-amd64
          path: build/gz-quality
          retention-days: 7

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
